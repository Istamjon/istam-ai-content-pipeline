# Keeps dependencies and CI actions current so a known-vulnerable version
# cannot sit unnoticed in the lockfile for weeks.
#
# Why this exists: the UnoRouter API key sat in the public repo across three
# commits and nobody noticed. That is a detection gap, not just a leak — this
# file plus repo-level secret scanning closes it from both sides.
version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Tashkent"
    open-pull-requests-limit: 5
    versioning-strategy: "increase"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # Batch routine minor/patch bumps into one reviewable PR.
      # Major bumps stay separate — they need a human reading the changelog
      # (sharp majors in particular can move the bundled libvips ABI).
      production-minor-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development-minor-patch:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Tashkent"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Tashkent"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(docker)"
    ignore:
      # A Node major must never be taken automatically. Dependabot proposed
      # node:22 -> node:25, which is wrong twice over:
      #   1. 25 is an odd-numbered "Current" release, never LTS, and its Docker
      #      Hub tag has been frozen since 2026-05-20 — i.e. unpatched.
      #   2. better-sqlite3 is compiled in the image (Dockerfile installs
      #      python3/make/g++ for it). The pinned v11.10.0 ships prebuilds only
      #      up to Node ABI 131, so any major past 23 falls back to node-gyp and
      #      fails to build. v12 is the first line with Node 24 prebuilds.
      # To move: open a PR targeting node:24-bookworm-slim (LTS) that upgrades
      # better-sqlite3 to v12 in the same commit.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
