# Full VDS health: HEAD, container, schedule, env policy, recent errors
name: VDS Health

on:
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        env:
          REMOTE_APP_DIR: ${{ secrets.VDS_PATH }}
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          port: ${{ secrets.VDS_PORT || 22 }}
          command_timeout: 10m
          script_stop: false
          envs: REMOTE_APP_DIR
          script: |
            set -e
            APP_DIR="${REMOTE_APP_DIR:-}"
            if [ -z "$APP_DIR" ] || [ ! -d "$APP_DIR" ]; then
              [ -d "$HOME/istam-ai-content-pipeline" ] && APP_DIR="$HOME/istam-ai-content-pipeline"
            fi
            if [ -z "$APP_DIR" ] || [ ! -d "$APP_DIR" ]; then
              [ -d /root/istam-ai-content-pipeline ] && APP_DIR=/root/istam-ai-content-pipeline
            fi
            if [ -z "$APP_DIR" ] || [ ! -d "$APP_DIR" ]; then
              [ -d /opt/istam-ai-content-pipeline ] && APP_DIR=/opt/istam-ai-content-pipeline
            fi
            echo "APP_DIR=$APP_DIR"
            test -n "$APP_DIR" && test -d "$APP_DIR"
            cd "$APP_DIR"
            export TZ="${TZ:-Asia/Tashkent}"

            echo "=== GIT HEAD ==="
            git fetch origin main 2>/dev/null || true
            echo "local=$(git rev-parse --short HEAD 2>/dev/null || echo none)"
            echo "origin=$(git rev-parse --short origin/main 2>/dev/null || echo none)"
            git log -1 --oneline 2>/dev/null || true

            echo "=== NOW ==="
            date

            echo "=== ENV (safe) ==="
            grep -E '^(DRY_RUN|CRON_|ENABLED_PLATFORMS|DAILY_LIMIT_|THREADS_MAX|GOOGLE_CLIENT_ID|BLOGGER_|NANOBANANA|SKYWORK_API_KEY=|UNOROUTER)' .env 2>/dev/null \
              | sed -E 's/(SECRET|TOKEN|KEY)=.*/\1=***/' || true

            echo "=== FACE ==="
            ls -la data/brand/face.jpg 2>/dev/null || echo "face.jpg missing"

            echo "=== CONTENT BUDGET (from the DEPLOYED dist) ==="
            # Read-only. Proves the length budget actually shipped, and that a
            # draft at the writer prompt's own target survives capDraftLength.
            # Before this probe existed, a 2000-char cap silently deleted the tail
            # of every draft and nothing in any log reported it.
            docker compose exec -T pipeline node -e "
            import('./dist/lib/draftRepair.js').then((m) => {
              const draft = Array.from({ length: 120 }, (_, i) => 'Bu ' + (i + 1) + '-jumla va u yetarlicha mazmunga ega.').join(' ');
              const out = m.capDraftLength(draft);
              console.log('MAX_DRAFT_CHARS=' + m.MAX_DRAFT_CHARS + ' MAX_BODY_CHARS=' + m.MAX_BODY_CHARS);
              console.log('draft=' + draft.length + ' -> capped=' + out.length + ' targetPreserved=' + (out.length >= 4400));
            }).catch((e) => console.log('budget probe failed:', e.message));
            " 2>&1 || echo "(budget probe failed)"

            echo "=== LIVE IMAGE PIPELINE PROBE ==="
            docker compose exec -T pipeline node -r dotenv/config -e "import('./dist/lib/imagePipeline.js').then(m => m.logAllImageBudgets())" 2>&1 || true

            echo "=== SCHEDULE ==="
            cat data/daily-schedule.json 2>/dev/null || echo "no schedule yet"

            echo "=== PUBLISH HISTORY (data/app.db) ==="
            # Read-only. Answers "did anything publish today, and if not, why".
            docker compose exec -T pipeline node -e "
            import('better-sqlite3').then((m) => {
              const Database = m.default;
              const db = new Database('/app/data/app.db', { readonly: true });
              const q = (sql) => { try { return db.prepare(sql).all(); } catch (e) { return [{ err: e.message }]; } };
              console.log('-- posts: last 12 (newest first) --');
              for (const r of q(\"SELECT id, platform, status, published_at, substr(coalesce(error,''),1,150) AS err FROM posts ORDER BY id DESC LIMIT 12\")) console.log(JSON.stringify(r));
              console.log('-- posts touched today (Asia/Tashkent = UTC+5) --');
              for (const r of q(\"SELECT id, platform, status, published_at, substr(coalesce(error,''),1,150) AS err FROM posts WHERE date(coalesce(published_at, scheduled_at), '+5 hours') = date('now', '+5 hours') ORDER BY id DESC LIMIT 20\")) console.log(JSON.stringify(r));
              console.log('-- status counts today --');
              for (const r of q(\"SELECT status, count(*) AS n FROM posts WHERE date(coalesce(published_at, scheduled_at), '+5 hours') = date('now', '+5 hours') GROUP BY status\")) console.log(JSON.stringify(r));
              console.log('-- daily_counts (last 10) --');
              for (const r of q('SELECT * FROM daily_counts ORDER BY date DESC LIMIT 10')) console.log(JSON.stringify(r));
              console.log('-- image_provider_usage (last 40 rows) --');
              for (const r of q('SELECT * FROM image_provider_usage ORDER BY date DESC, provider LIMIT 40')) console.log(JSON.stringify(r));
              db.close();
            }).catch((e) => console.log('db probe failed:', e.message));
            " 2>&1 || echo "(db query failed)"

            echo "=== DATA DIR ==="
            ls -la data/ 2>/dev/null | head -30
            echo "--- generated images (newest 12) ---"
            ls -lt data/images/ 2>/dev/null | head -13 || echo "(no images dir)"

            echo "=== TELEGRAM REACHABILITY (from inside container) ==="
            docker compose exec -T pipeline node -e "
            const t = process.env.TELEGRAM_BOT_TOKEN || '';
            if (!t) { console.log('TELEGRAM_BOT_TOKEN not set in container'); process.exit(0); }
            const t0 = Date.now();
            fetch('https://api.telegram.org/bot' + t + '/getMe', { signal: AbortSignal.timeout(12000) })
              .then(async (r) => { const j = await r.json(); console.log('getMe http=' + r.status + ' ms=' + (Date.now() - t0) + ' ok=' + j.ok + ' user=@' + (j.result && j.result.username)); })
              .catch((e) => console.log('getMe FAILED ms=' + (Date.now() - t0) + ' err=' + e.message));
            " 2>&1 || echo "(telegram probe failed)"

            echo "=== OTHER CONTAINERS (previous runs keep their own logs) ==="
            docker ps -a --format '{{.Names}}\t{{.Status}}\t{{.Image}}' 2>/dev/null || true

            echo "=== CONTAINER ==="
            docker compose ps -a || true
            STATUS=$(docker inspect -f '{{.State.Status}}' istam-ai-pipeline 2>/dev/null || echo missing)
            RESTART=$(docker inspect -f '{{.RestartCount}}' istam-ai-pipeline 2>/dev/null || echo na)
            echo "status=$STATUS restarts=$RESTART"

            echo "=== LOGS (tail 100) ==="
            docker compose logs --tail=100 2>&1 || true

            echo "=== ERROR GREP ==="
            docker compose logs --tail=300 2>&1 | grep -iE 'error|fail|exception|crash|ENOENT|cannot|rejected' | tail -40 || echo "(no recent errors matched)"

            if [ "$STATUS" != "running" ]; then
              echo "::error::Container not running ($STATUS)"
              exit 1
            fi
            echo "=== HEALTH OK ==="
