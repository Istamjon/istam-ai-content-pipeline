# Auto-deploy to VDS after CI succeeds on main.
#
# Secrets: VDS_HOST, VDS_USER, VDS_SSH_KEY
# Optional: VDS_PORT (22), VDS_PATH (/root/istam-ai-content-pipeline)

name: Deploy VDS

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vds
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VDS
    runs-on: ubuntu-latest
    timeout-minutes: 35
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')

    steps:
      - name: Check deploy secrets
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USER: ${{ secrets.VDS_USER }}
          VDS_SSH_KEY: ${{ secrets.VDS_SSH_KEY }}
        run: |
          missing=0
          [ -z "$VDS_HOST" ] && echo "Missing secret: VDS_HOST" && missing=1
          [ -z "$VDS_USER" ] && echo "Missing secret: VDS_USER" && missing=1
          [ -z "$VDS_SSH_KEY" ] && echo "Missing secret: VDS_SSH_KEY" && missing=1
          if [ "$missing" -ne 0 ]; then
            echo "::error::Add VDS_HOST, VDS_USER, VDS_SSH_KEY in repo Settings → Secrets"
            exit 1
          fi
          echo "Secrets present"

      - name: Deploy over SSH (pull + scripts/vds-deploy.sh)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          port: ${{ secrets.VDS_PORT || 22 }}
          command_timeout: 30m
          # false: drone-ssh would otherwise inject an exit-code check line
          # between EVERY script line, which breaks multi-line case blocks.
          # The script already does `set -euo pipefail` for stop-on-error.
          script_stop: false
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.VDS_PATH }}"
            if [ -z "$APP_DIR" ]; then
              APP_DIR="$HOME/istam-ai-content-pipeline"
            fi
            echo "=== Deploy dir: $APP_DIR ==="
            cd "$APP_DIR"

            # GitHub HTTPS from some VDS ranges is intermittently broken
            # ("could not read Username" + "expected flush after ref listing").
            # Prefer the SSH deploy key when available; always retry, never prompt.
            REPO_SSH="git@github.com:Istamjon/istam-ai-content-pipeline.git"
            REPO_HTTPS="https://github.com/Istamjon/istam-ai-content-pipeline.git"

            fetch_retry() {
              for i in 1 2 3; do
                if GIT_TERMINAL_PROMPT=0 git fetch "$1" main; then return 0; fi
                echo "WARN: git fetch attempt $i failed ($1)"
                sleep 8
              done
              return 1
            }

            ssh_auth_ok() {
              out=$(ssh -o BatchMode=yes -o ConnectTimeout=10 \
                     -o StrictHostKeyChecking=accept-new -T git@github.com 2>&1 || true)
              echo "$out" | grep -q "successfully authenticated"
            }

            CUR=$(git remote get-url origin)
            echo "origin=$CUR"
            fetch_ok=0
            if ssh_auth_ok; then
              case "$CUR" in
                git@github.com:*|ssh://git@github.com/*) URL="$CUR" ;;
                *) URL="$REPO_SSH" ;;
              esac
              if fetch_retry "$URL"; then
                [ "$URL" = "$CUR" ] || git remote set-url origin "$URL"
                fetch_ok=1
              else
                echo "WARN: SSH deploy-key fetch failed — falling back to HTTPS"
              fi
            fi
            if [ "$fetch_ok" != "1" ]; then
              if fetch_retry "$REPO_HTTPS"; then
                [ "$CUR" = "$REPO_HTTPS" ] || git remote set-url origin "$REPO_HTTPS"
                fetch_ok=1
              fi
            fi
            if [ "$fetch_ok" != "1" ]; then
              echo "::error::git fetch failed via SSH and HTTPS — aborting deploy"
              exit 1
            fi

            git checkout main
            git reset --hard origin/main
            echo "HEAD=$(git rev-parse --short HEAD)"
            chmod +x scripts/vds-deploy.sh
            # Already at origin/main; script re-fetches best-effort for safety
            bash scripts/vds-deploy.sh
