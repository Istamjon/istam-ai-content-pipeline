# One-shot probe: what long/rich message formats does this bot's Telegram API
# actually accept, and in which chats?
#
# Runs scripts/tg-rich-probe.mjs INSIDE the pipeline container, where
# TELEGRAM_BOT_TOKEN lives. The token is never printed — only API responses.
# All probe messages are deleted except one showcase in the admin chat.
#
# Usage:  gh workflow run tg-rich-probe.yml
name: TG Rich Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check secrets
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USER: ${{ secrets.VDS_USER }}
          VDS_SSH_KEY: ${{ secrets.VDS_SSH_KEY }}
        run: |
          [ -n "$VDS_HOST" ] && [ -n "$VDS_USER" ] && [ -n "$VDS_SSH_KEY" ] || {
            echo "::error::Missing VDS_* secrets"
            exit 1
          }

      - name: Probe over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          REMOTE_APP_DIR: ${{ secrets.VDS_PATH }}
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          port: ${{ secrets.VDS_PORT || 22 }}
          command_timeout: 8m
          script_stop: false
          envs: REMOTE_APP_DIR
          script: |
            set -e
            APP_DIR="${REMOTE_APP_DIR:-}"
            if [ -z "$APP_DIR" ] || [ ! -d "$APP_DIR" ]; then
              [ -d "$HOME/istam-ai-content-pipeline" ] && APP_DIR="$HOME/istam-ai-content-pipeline"
            fi
            if [ -z "$APP_DIR" ] || [ ! -d "$APP_DIR" ]; then
              [ -d /root/istam-ai-content-pipeline ] && APP_DIR=/root/istam-ai-content-pipeline
            fi
            if [ -z "$APP_DIR" ] || [ ! -d "$APP_DIR" ]; then
              [ -d /opt/istam-ai-content-pipeline ] && APP_DIR=/opt/istam-ai-content-pipeline
            fi
            echo "APP_DIR=$APP_DIR"
            test -n "$APP_DIR" && test -d "$APP_DIR"
            cd "$APP_DIR"
            export TZ="${TZ:-Asia/Tashkent}"
            echo "=== GIT HEAD ==="
            echo "local=$(git rev-parse --short HEAD 2>/dev/null || echo none)"
            echo "=== CONTAINER ==="
            docker compose ps -a || true
            echo "=== RICH PROBE ==="
            # Script is baked into the image at /app/scripts by the Dockerfile.
            docker compose exec -T pipeline node scripts/tg-rich-probe.mjs 2>&1 || echo "(probe exited non-zero)"
            echo "=== DONE ==="
